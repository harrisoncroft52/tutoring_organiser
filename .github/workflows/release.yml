name: Build and publish release

# To release: change __version__ in tutoring_organiser/version.py and push to main.
# This workflow then tests the app, builds the Windows installer and publishes a GitHub Release
# (tag v<version>). Installed apps find that release and offer the update.
# Pushes that don't change version.py do nothing. You can also run it by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["tutoring_organiser/version.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      released: ${{ steps.exists.outputs.released }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        name: Read version
        run: echo "version=$(python3 -c 'from tutoring_organiser.version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"
      - id: exists
        name: Has this version already been released?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.ver.outputs.version }} is already released. Bump version.py to publish a new one."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run the app's self-test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          SMOKE_SKIP_GEOMETRY: "1"     # window-size checks depend on the machine's fonts; logic checks still run
        run: python tests/smoke_test.py

      - name: Build app (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean tutoring_organiser.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ needs.check.outputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" installer.iss
          $exe = "installer_output\TutoringOrganiser-Setup-$v.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TutoringOrganiser-Setup-$v.exe" | Set-Content -Encoding ascii "$exe.sha256"

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          # The "## <version>" section of CHANGELOG.md becomes the release notes (the in-app updater shows them).
          $v = "${{ needs.check.outputs.version }}"
          $notes = @(); $inside = $false
          if (Test-Path CHANGELOG.md) {
            foreach ($line in Get-Content CHANGELOG.md -Encoding utf8) {
              if ($line -match '^## ') { if ($inside) { break }; $inside = ($line.Trim() -eq "## $v"); continue }
              if ($inside) { $notes += $line }
            }
          }
          ($notes -join "`n").Trim() | Set-Content -Encoding utf8 release_notes.md

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ needs.check.outputs.version }}"
          if ((Get-Item release_notes.md).Length -gt 3) { $notesArgs = @("--notes-file", "release_notes.md") }
          else { $notesArgs = @("--generate-notes") }     # no CHANGELOG section: list the commits instead
          gh release create "v$v" installer_output\*.exe installer_output\*.sha256 `
            --target "${{ github.sha }}" --title "Tutoring Organiser $v" @notesArgs
